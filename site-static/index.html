<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校招公司池</title>
    <meta
      name="description"
      content="按企业类型、行业、地区和链接状态筛选在中国有校园招聘信号的公司池。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="results-section" id="results">
        <div class="company-table">
          <div id="table-head" class="company-table-head company-table-head-filters"></div>
          <div id="table-body" class="company-table-body"></div>

          <div id="empty-state" class="empty-state hidden">
            <h2>没有匹配结果</h2>
            <p class="muted">可以调整当前筛选条件，或直接返回全部公司列表。</p>
            <div class="empty-state-actions">
              <button id="reset-button" class="button" type="button">返回全部公司</button>
            </div>
          </div>

          <div id="pagination-bar" class="pagination-bar hidden">
            <div id="pagination-summary" class="pagination-summary"></div>
            <div id="pagination-links" class="pagination-links"></div>
          </div>
        </div>
      </section>

      <div id="external-link-modal" class="external-link-modal-backdrop hidden" role="presentation">
        <div aria-modal="true" class="external-link-modal" role="dialog">
          <h3>即将跳转到招聘网站</h3>
          <p class="muted">将打开以下链接：</p>
          <p id="external-link-url" class="external-link-url"></p>
          <div class="external-link-actions">
            <button id="external-link-cancel" class="button-secondary" type="button">取消</button>
            <a id="external-link-confirm" class="button" href="#" rel="noreferrer" target="_blank">继续打开</a>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
