<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校招公司池</title>
    <meta
      name="description"
      content="按企业类型、行业、地区和链接状态筛选在中国有校园招聘信号的公司池。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Campus Hiring Signal Index</p>
          <h1>校招公司池</h1>
          <p class="hero-text">
            聚合在中国有校招信号的公司，并按企业类型、行业、工作地点、链接核验状态进行筛选。
          </p>
        </div>
        <div class="hero-card">
          <div class="metric">
            <span class="metric-label">数据快照</span>
            <strong id="snapshot-date">加载中</strong>
          </div>
          <div class="metric">
            <span class="metric-label">公司总数</span>
            <strong id="total-count">-</strong>
          </div>
          <div class="metric">
            <span class="metric-label">当前结果</span>
            <strong id="visible-count">-</strong>
          </div>
          <a class="ghost-button" href="./about.html">查看口径说明</a>
        </div>
      </header>

      <main class="layout">
        <aside class="filters">
          <div class="filters-sticky">
            <section class="panel panel-intro">
              <h2>筛选器</h2>
              <p>所有筛选和分页都在浏览器中完成，适合直接托管到 GitHub Pages。</p>
            </section>

            <section class="panel">
              <label class="field">
                <span>关键词</span>
                <input id="keyword-input" class="text-input" type="search" placeholder="公司名、行业、城市、标签" />
              </label>

              <label class="field">
                <span>每页条数</span>
                <select id="page-size-select" class="select-input">
                  <option value="12">12 条</option>
                  <option value="24">24 条</option>
                  <option value="48">48 条</option>
                </select>
              </label>

              <div class="button-row">
                <button id="reset-button" class="primary-button" type="button">清空筛选</button>
              </div>
            </section>

            <section class="panel">
              <div class="filter-section-header">
                <h3>企业类型</h3>
                <span id="type-count" class="filter-count">0</span>
              </div>
              <div id="company-type-options" class="choice-list"></div>
            </section>

            <section class="panel">
              <div class="filter-section-header">
                <h3>行业分组</h3>
                <span id="industry-count" class="filter-count">0</span>
              </div>
              <div id="industry-options" class="choice-list"></div>
            </section>

            <section class="panel">
              <div class="filter-section-header">
                <h3>工作省份</h3>
                <span id="province-count" class="filter-count">0</span>
              </div>
              <div id="province-options" class="choice-list choice-list-scroll"></div>
            </section>

            <section class="panel">
              <div class="filter-section-header">
                <h3>链接状态</h3>
                <span id="link-count" class="filter-count">0</span>
              </div>
              <div id="link-status-options" class="choice-list"></div>
            </section>
          </div>
        </aside>

        <section class="content">
          <div class="toolbar">
            <div>
              <p class="toolbar-label">当前结果</p>
              <h2 id="results-title">加载中</h2>
            </div>
            <div class="toolbar-meta">
              <span id="active-campus-count" class="chip">-</span>
              <span id="verified-link-count" class="chip">-</span>
            </div>
          </div>

          <div id="active-filters" class="active-filters"></div>
          <div id="results-grid" class="results-grid"></div>
          <div id="empty-state" class="panel empty-state hidden">
            <h3>没有匹配结果</h3>
            <p>可以尝试减少筛选项，或者只保留关键词搜索。</p>
          </div>
          <nav id="pagination" class="pagination" aria-label="分页"></nav>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
